[project]
name = "mcp-for-blender-lite"
version = "2.1.9.post1"
description = "Offline fork of MCP for Blender: no telemetry, no cloud services (not affiliated with Blender Foundation)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"},
    {name = "ozthealem"},
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.26.0,<2",
]

[project.scripts]
mcp-for-blender-lite = "blender_mcp.server:main"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
blender_mcp = ["bundled/addon.py", "apps/*.html", "guides/*.md"]

[project.urls]
"Homepage" = "https://github.com/ozthealem/mcp-for-blender-lite"
"Upstream" = "https://github.com/ahujasid/blender-mcp"
